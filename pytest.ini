[pytest]
# `live` tests need real API keys, MCP servers, or internet access and are
# excluded by default so the standard suite (local and CI) stays hermetic.
# Run them explicitly with: pytest -m live
addopts = -m "not live" --strict-markers
markers =
    live: tests that require live external services, API keys, MCP servers, or internet access
    integration: broader integration tests that exercise multiple local subsystems
    slow: slower deterministic tests that may be split into a dedicated job later
