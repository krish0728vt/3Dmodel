name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      SHAH_LEARNING_DB_PATH: ${{ runner.temp }}/shah_ci/shah_learning.db
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system CAD dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxrender1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Run pytest
        run: python -m pytest --junitxml=test-results/python.xml
      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results/python.xml
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build

  evaluation-smoke:
    name: Evaluation smoke
    runs-on: ubuntu-latest
    env:
      SHAH_LEARNING_DB_PATH: ${{ runner.temp }}/shah_ci/shah_learning.db
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system CAD dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxrender1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run deterministic smoke benchmark
        run: python app.py evaluate smoke
      - name: Compare against baseline
        run: python app.py evaluate compare
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            outputs/evaluation/latest.json
            outputs/evaluation/latest.md
          if-no-files-found: ignore

  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repository security scan
        run: python scripts/security_check.py
